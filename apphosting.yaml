# Firebase App Hosting backend config (Phase 6 of docs/nextjs-migration-plan.md).
#
# This file only describes the backend; it does not create or deploy one.
# The backend has to be created once (`firebase apphosting:backends:create`,
# region europe-west1) and PERSPECTIVE_API_KEY has to exist in Secret Manager
# with the backend's service account granted access
# (`firebase apphosting:secrets:set PERSPECTIVE_API_KEY` does both).

# Match Firestore and the remaining Cloud Function (syncTempSummary) so
# server-side reads don't cross a region.
# NOTE: region is set on the backend at creation time, not here; kept as a
# comment so the intended value lives with the rest of the config.
# region: europe-west1

runConfig:
  # Scale to zero: the app is a small hobby league and static Hosting cost
  # ~nothing. The trade-off is a Node cold start on the first crawler hit —
  # measure Search Console latency before paying for minInstances: 1.
  minInstances: 0
  # A cap, not a target. Well above normal traffic but low enough that a
  # crawl storm or a loop in a client can't run up an unbounded bill.
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  # The longest route is /api/deleteAccount and /api/banUser, which walk every
  # session/group/leaderboard doc a user appears in (the callables allowed 120 s).
  timeoutSeconds: 120

env:
  # ── Public client config ──────────────────────────────────────────────
  # Everything NEXT_PUBLIC_* is inlined into the browser bundle at build
  # time, so it must be available at BUILD as well as RUNTIME. Nothing
  # secret belongs in this list (see src/env.d.ts).
  #
  # These MUST be filled in. src/firebase.ts falls back to
  # `demo-badabadahavet` placeholders when they are blank, so an empty value
  # here silently ships an app pointed at a project that doesn't exist.
  #
  # appId is the `badligan-app` web app (…8475b0b5…) — the one the app has
  # always used. Note `apphosting:backends:create` offers to make a NEW web
  # app for the backend; a new appId has no linked measurementId and would
  # split Analytics, so keep this pinned to the original regardless of what
  # the backend is associated with. App Hosting also injects
  # FIREBASE_WEBAPP_CONFIG for its associated app, which this app ignores.
  #
  # The API key is referrer-restricted, so the *.hosted.app origin has to be
  # added to its allowlist or the client SDK starts 403-ing.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAkjIYctZLIn3E28EBwF-iPdSgmU0rVkc0
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: badligan.club
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: badligan
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: badligan.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 738800912317
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:738800912317:web:8475b0b5184cf99bf034d4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-JPZLPV7NBV
    availability:
      - BUILD
      - RUNTIME
  # Production talks to the real project, never the emulators.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  # CARTO basemap key — without it every map tile is stamped "API KEY
  # REQUIRED". Public by necessity (the browser requests the tiles) and
  # restricted to our domains at CARTO, so it belongs here as a plain value.
  # Free to 5M tile requests/month; the Workbox tile cache is gone (Phase 4),
  # so tiles now lean on the HTTP cache alone — watch the count after cutover.
  - variable: NEXT_PUBLIC_CARTO_API_KEY
    value: cb1_2fuu_1_8f68095b4dd6862aacdf32f4
    availability:
      - BUILD
      - RUNTIME

  # ── Server-only secrets ───────────────────────────────────────────────
  # Perspective API key for text moderation. RUNTIME only: it is read in
  # Route Handlers (src/server/moderate.ts) and must never reach the client
  # bundle. When it is missing, moderation is skipped — the checks fail open
  # on purpose, so a missing secret degrades quietly instead of blocking
  # swims.
  - variable: PERSPECTIVE_API_KEY
    secret: PERSPECTIVE_API_KEY
    availability:
      - RUNTIME
