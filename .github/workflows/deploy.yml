name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run if a newer commit is pushed to the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Deploy App Hosting + rules
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # A build CHECK, not the deploy artifact: the App Hosting deploy below
      # uploads *source*, and Cloud Build runs `next build` again server-side
      # with the env from apphosting.yaml. This step exists so a build failure
      # fails the job here — fast and with readable logs — rather than 10
      # minutes later inside a Cloud Build rollout.
      #
      # The GitHub secret NAMES still say VITE_* — renaming them means a
      # manual pass in repo settings and buys nothing. Only the env-var names
      # the app reads changed. VITE_PERSPECTIVE_API_KEY is deliberately absent
      # now: the Perspective key is server-only (a Secret Manager secret, see
      # apphosting.yaml) and must never be inlined into the browser bundle.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
        run: npm run build

      # Legacy Firebase Hosting is NOT deployed from here. `npm run build`
      # produces .next, not dist/, so the old `deploy --only hosting` would
      # push an empty directory over the live site. The firebase.json hosting
      # block stays only as the Phase 6 rollback path — see
      # docs/nextjs-migration-plan.md.
      #
      # Rules are idempotent (skip-if-unchanged), so deploy them directly.
      # Auth uses the service-account secret via GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy Firestore + Storage rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          npx --yes firebase-tools@15 deploy --only firestore,storage \
            --project "$FIREBASE_PROJECT" --non-interactive --force

      # Release the app. This uploads the repo as SOURCE (per the firebase.json
      # `apphosting` block); Cloud Build then runs the Next build server-side
      # with the env and secrets from apphosting.yaml.
      #
      # `alwaysDeployFromSource: true` in firebase.json is what makes this
      # work unattended: without it, a backend that is ALSO linked to a GitHub
      # repo triggers an "are you sure you want to deploy your local source?"
      # prompt, which cannot be answered in CI.
      #
      # Deliberately NO --force here. If the backend doesn't exist yet, --force
      # makes firebase-tools log a warning and skip the deploy silently, so a
      # green run would mean nothing was released. Without it, the missing
      # backend hits a prompt and --non-interactive turns that into a loud
      # failure, which is what you want from a deploy step.
      #
      # ⚠ Two things to get right on the App Hosting side, or this fights with
      # itself:
      #   1. The backend's own automatic rollouts must be OFF (or pointed at a
      #      branch nobody pushes). A GitHub-connected backend builds on push
      #      to its branch, and this step uploads source too — leave both on
      #      and every push to main produces two concurrent rollouts.
      #   2. FIREBASE_SERVICE_ACCOUNT needs Firebase App Hosting Admin, plus
      #      Cloud Build, Artifact Registry, Storage and Secret Manager
      #      accessor — the same class of grant the functions deploy below
      #      needs. Expect a permissions error on the first run until it has
      #      them.
      - name: Deploy App Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          npx --yes firebase-tools@15 deploy --only apphosting \
            --project "$FIREBASE_PROJECT" --non-interactive

      # Functions deploy needs the deploy service account to have
      # "Service Account User" (iam.serviceAccounts.actAs) on the runtime SA
      # <project>@appspot.gserviceaccount.com, plus Cloud Functions / Cloud
      # Build / Artifact Registry roles. Until that's granted, deploy
      # functions manually:
      #   GOOGLE_APPLICATION_CREDENTIALS=./service-account.json \
      #     npx firebase-tools deploy --only functions --project badligan
      # Once the SA has the roles, set repo variable DEPLOY_FUNCTIONS=true
      # (Settings → Secrets and variables → Actions → Variables) to enable
      # the two steps below — no workflow edit needed.
      #
      # ⚠ CUTOVER HAZARD, while the Next migration is mid-flight: functions/
      # is now down to syncTempSummary alone, and `deploy --only functions
      # --force` DELETES every function no longer in the codebase — the ten
      # callables and spotPreview/sitemap included. That is the end state, but
      # the plan (Phase 5 / "Cutover and rollback") deliberately keeps the old
      # onCall functions deployed for a week so a client rollback still works.
      # So leave DEPLOY_FUNCTIONS unset until the domain has been on App
      # Hosting long enough that rolling back to the Vite client is off the
      # table; deleting them earlier makes that rollback impossible.
      - name: Install functions dependencies
        if: vars.DEPLOY_FUNCTIONS == 'true'
        run: npm ci
        working-directory: functions

      - name: Deploy functions
        if: vars.DEPLOY_FUNCTIONS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy \
            --only functions \
            --project "$FIREBASE_PROJECT" \
            --non-interactive --force
